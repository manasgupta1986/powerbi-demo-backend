<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>PowerBI Demo Assistant</title>
  <style>
    body { font-family: Arial, sans-serif; width: 100%; padding: 14px; background: #f8fafc; color: #111827; box-sizing: border-box; }
    h1 { font-size: 18px; margin: 0 0 12px 0; }
    label { display: block; font-size: 12px; font-weight: bold; margin-top: 10px; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 8px; border-radius: 10px; border: 1px solid #cbd5e1; margin-top: 4px; }
    textarea { min-height: 72px; resize: vertical; }
    #filterConfig { min-height: 160px; font-family: Menlo, Monaco, monospace; font-size: 12px; }
    button { margin-top: 10px; width: 100%; border: 0; border-radius: 10px; padding: 10px; cursor: pointer; font-weight: bold; }
    .primary { background: #2563eb; color: white; }
    .secondary { background: #111827; color: white; }
    .ghost { background: #e5e7eb; color: #111827; }
    #status, #answer, #latestInfo, #runLog { white-space: pre-wrap; background: white; border-radius: 10px; padding: 10px; margin-top: 10px; border: 1px solid #e5e7eb; }
    #status { min-height: 64px; overflow-wrap: anywhere; }
    #runLog { min-height: 180px; max-height: 320px; overflow: auto; font-family: Menlo, Monaco, monospace; font-size: 12px; }
    .small { color: #6b7280; font-size: 12px; }
  </style>
</head>
<body>
  <h1>PowerBI Demo Assistant</h1>

  <label>Client name</label>
  <input id="clientName" value="Amazon Demo" />

  <label>Dashboard URL</label>
  <input id="dashboardUrl" placeholder="Paste Power BI URL here" />

  <label>Backend URL</label>
  <input id="backendUrl" value="http://localhost:3001" placeholder="https://your-render-service.onrender.com" />

  <label>Tab names, comma separated</label>
  <input id="pageNames" value="Traffic Engagement, Purchase Matrix, Purchase Funnel" />

  <label>Time filter text</label>
  <input id="timeFilterText" value="" />

  <label>Filter sweep config JSON</label>
  <textarea id="filterConfig">[
  {
    "filterName": "Zone",
    "allLabel": "All",
    "options": ["East", "North", "South", "West"]
  }
]</textarea>

  <button class="primary" id="saveSettings">Save settings</button>
  <button class="ghost" id="loadLatest">Load latest saved run</button>
  <button class="ghost" id="openReport">Open latest saved report</button>
  <button class="secondary" id="runAnalysis">Run new sweep</button>

  <label>Ask saved dashboard run</label>
  <textarea id="question" placeholder="Example: Which cohort looks most important for the category lead to investigate next?"></textarea>
  <button class="primary" id="askBtn">Ask</button>

  <div id="status">Status: ready</div>
  <div id="latestInfo">Latest saved run details will appear here.</div>
  <label>Detailed live log</label>
  <div id="runLog">Run log will appear here.</div>
  <div id="answer">Answer will appear here.</div>
  <div class="small">Recommended demo flow: run the sweep in the morning, then open this side panel in the client meeting and use Load latest saved run + Open latest saved report + Q&A.</div>

  <script src="sidepanel.js"></script>
</body>
</html>
