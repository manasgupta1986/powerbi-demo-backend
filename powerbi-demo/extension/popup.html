<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>PowerBI Demo Assistant</title>
  <style>
    body { font-family: Arial, sans-serif; width: 380px; padding: 14px; background: #f8fafc; color: #111827; }
    h1 { font-size: 18px; margin: 0 0 12px 0; }
    label { display: block; font-size: 12px; font-weight: bold; margin-top: 10px; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 8px; border-radius: 10px; border: 1px solid #cbd5e1; margin-top: 4px; }
    textarea { min-height: 72px; resize: vertical; }
    #filterConfig { min-height: 160px; font-family: Menlo, Monaco, monospace; font-size: 12px; }
    button { margin-top: 10px; width: 100%; border: 0; border-radius: 10px; padding: 10px; cursor: pointer; font-weight: bold; }
    .primary { background: #2563eb; color: white; }
    .secondary { background: #111827; color: white; }
    .ghost { background: #e5e7eb; color: #111827; }
    #status, #answer { white-space: pre-wrap; background: white; border-radius: 10px; padding: 10px; margin-top: 10px; border: 1px solid #e5e7eb; }
    .small { color: #6b7280; font-size: 12px; }
  </style>
</head>
<body>
  <h1>PowerBI Demo Assistant</h1>

  <label>Client name</label>
  <input id="clientName" value="Amazon Demo" />

  <label>Dashboard URL</label>
  <input id="dashboardUrl" placeholder="Paste Power BI URL here" />

  <label>Backend URL</label>
  <input id="backendUrl" value="http://localhost:3001" placeholder="https://your-render-service.onrender.com" />

  <label>Tab names, comma separated</label>
  <input id="pageNames" value="Overview, Market Share, Category" />

  <label>Time filter text</label>
  <input id="timeFilterText" value="Last 4 Weeks" />

  <label>Filter sweep config JSON</label>
  <textarea id="filterConfig">[
  {
    "filterName": "Brand",
    "allLabel": "All",
    "options": ["Brand A", "Brand B", "Brand C"]
  },
  {
    "filterName": "Region",
    "allLabel": "All",
    "options": ["North", "South", "West"]
  }
]</textarea>

  <button class="primary" id="saveSettings">Save settings</button>
  <button class="secondary" id="runAnalysis">Run filter sweep on current tab</button>
  <button class="ghost" id="openReport">Open latest report</button>

  <label>Ask dashboard</label>
  <textarea id="question" placeholder="Example: What changed in the last 4 weeks and what should the brand manager do?"></textarea>
  <button class="primary" id="askBtn">Ask</button>

  <div id="status">Status: ready</div>
  <div id="answer">Answer will appear here.</div>
  <div class="small">Tip: open the Power BI dashboard tab before clicking Run filter sweep. Use exact visible tab names, filter names, and option labels from the dashboard.</div>

  <script src="popup.js"></script>
</body>
</html>
